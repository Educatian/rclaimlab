name: R-ClaimLab external validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  r-version-contract:
    name: R contract (${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: [oldrel, release, devel]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck any::covr
          needs: check
      - name: Verify source tarball boundary
        if: matrix.r == 'release'
        run: Rscript scripts/check_source_tarball.R
      - uses: r-lib/actions/check-r-package@v2
      - name: Evidence Compiler contract coverage
        if: matrix.r == 'release'
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests", quiet = TRUE)
          details <- as.data.frame(coverage)
          core_files <- c("R/evidence_spec.R", "R/evidence_adapters.R", "R/foundational_adapters.R", "R/compile_lesson.R", "R/lesson_manifest.R")
          core <- details[details$filename %in% core_files, , drop = FALSE]
          workflow_files <- c("R/workflow_spec.R", "R/workflow_engine.R", "R/workflow_compiler.R", "R/workflow_receipt.R", "R/workflow_ai.R")
          workflow_core <- details[details$filename %in% workflow_files, , drop = FALSE]
          source_contract_functions <- c(
            "dataset_source", "inspect_dataset", "preview_dataset", "import_dataset", "profile_dataset",
            "validate_dataset_source", "validate_dataset_manifest", "validate_rclaimlab_dataset",
            "reject_unsupported_tabular_data", "rows_to_data_frame"
          )
          source_core <- details[
            details$filename == "R/dataset_sources.R" & details$functions %in% source_contract_functions,
            , drop = FALSE
          ]
          overall_percent <- covr::percent_coverage(coverage)
          core_percent <- 100 * mean(core$value > 0)
          workflow_percent <- 100 * mean(workflow_core$value > 0)
          source_percent <- 100 * mean(source_core$value > 0)
          message("Overall coverage: ", round(overall_percent, 2), "%")
          message("Evidence Compiler coverage: ", round(core_percent, 2), "%")
          message("Role workflow contract coverage: ", round(workflow_percent, 2), "%")
          message("Dataset source public contract coverage: ", round(source_percent, 2), "%")
          if (overall_percent < 85) stop("Overall coverage is below 85%")
          if (core_percent < 95) stop("Evidence Compiler contract coverage is below 95%")
          if (workflow_percent < 95) stop("Role workflow contract coverage is below 95%")
          if (source_percent < 95) stop("Dataset source public contract coverage is below 95%")

  r-package-and-lessons:
    name: R package and lessons (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck any::remotes
          needs: check
      - uses: r-lib/actions/check-r-package@v2
      - name: Install source package for Quarto execution
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source', quiet = TRUE)"
      - name: Build reference lessons
        run: Rscript scripts/build_all_lessons.R
      - name: Build role-adaptive workflow demos
        run: Rscript scripts/build_role_workflow_demo.R
      - name: Check all reference lessons
        run: Rscript scripts/check_all_lessons.R
      - name: Check role-adaptive workflow demos
        shell: Rscript {0}
        run: |
          roots <- file.path("examples", "role-workflows", c("analyst", "scientist", "reviewer"))
          results <- lapply(roots, rclaimlab::check_workflow, strict = TRUE)
          stopifnot(all(vapply(results, function(x) all(x$status == "PASS"), logical(1))))
      - name: Render all Quarto lessons
        run: Rscript scripts/render_all_lessons.R
      - name: Upload lesson reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-lessons-${{ matrix.os }}
          path: |
            examples/*/_site
            examples/*/checks
            examples/role-workflows/*/app
            examples/role-workflows/*/checks

  huggingface-live-smoke:
    name: Pinned Hugging Face live workflow
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Inspect, preview, import, model, and validate pinned public data
        run: Rscript scripts/live_huggingface_workflow_smoke.R

  public-install:
    name: Preserve stable public v1.1.0 install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: check
      - name: Install legacy v1.1.0 tag into a clean library
        shell: Rscript {0}
        run: |
          clean_lib <- file.path(tempdir(), "rlearnxr-v1-clean-library")
          dir.create(clean_lib, recursive = TRUE)
          .libPaths(c(clean_lib, .libPaths()))
          remotes::install_git("https://github.com/Educatian/rclaimlab.git", ref = "v1.1.0", upgrade = "never")
          library(rlearnxr, lib.loc = clean_lib)
          stopifnot(as.character(packageVersion("rlearnxr")) == "1.1.0")
          stopifnot(all(c("check_lesson", "render_scene", "scaffold_lesson") %in% getNamespaceExports("rlearnxr")))
          message("Legacy v1.1.0 clean-install rehearsal passed")

  pkgdown:
    name: Build pkgdown and check links
    runs-on: ubuntu-latest
    needs: r-version-contract
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown any::urlchecker
          needs: website
      - name: Build documentation site
        run: Rscript -e "pkgdown::build_site(new_process = FALSE)"
      - name: Check package URLs
        run: Rscript -e "urlchecker::url_check()"
      - name: Upload pkgdown site
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-pkgdown
          path: site

  posit-cloud-persona-proxy:
    name: Posit Cloud clean-room persona proxy
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes any::palmerpenguins
          needs: check
      - name: Run clean-room authoring persona
        run: Rscript scripts/persona_validation.R
      - name: Upload Posit Cloud proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-posit-cloud-persona-proxy
          path: output/audit/persona-validation/posit-cloud-proxy.csv

  browser-smoke:
    name: Browser interaction smoke test
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke test
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run browser interaction and responsive smoke test
        shell: pwsh
        run: ./scripts/browser_smoke_test.ps1 -StartServer -ServerPort 8770
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-browser-smoke
          path: output/playwright/rclaimlab-browser-smoke-*.png

  role-workflow-browser:
    name: Role-adaptive workflow browser
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Build portable role workflow demos
        run: Rscript scripts/build_role_workflow_demo.R
      - name: Install Chromium for role workflow smoke test
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run responsive and interaction test
        shell: pwsh
        run: ./scripts/browser_role_workflow_smoke_test.ps1 -StartServer
      - name: Upload role workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-role-workflow-browser
          path: |
            output/playwright/rclaimlab-role-workflow-*.png
            output/playwright/rclaimlab-storyboard-*.png

  browser-offline-smoke:
    name: Offline WebR fallback smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run offline fallback test
        shell: pwsh
        run: ./scripts/browser_offline_smoke_test.ps1 -StartServer
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-browser-offline-fallback
          path: output/playwright/rclaimlab-browser-offline-fallback.png

  course-home-smoke:
    name: Learner course home smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for course-home smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run course-home navigation and responsive test
        shell: pwsh
        run: ./scripts/browser_course_smoke_test.ps1 -StartServer
      - name: Run beginner-guide content and responsive test
        shell: pwsh
        run: ./scripts/browser_beginner_guide_smoke_test.ps1 -StartServer
      - name: Upload course-home and beginner-guide screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-course-home
          path: |
            output/playwright/rclaimlab-course-home-*.png
            output/playwright/rclaimlab-beginner-guide-*.png

  lesson-wizard-smoke:
    name: Local CSV Lesson Wizard smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install Chromium for Lesson Wizard smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run local CSV to compiled lesson flow
        shell: pwsh
        run: ./scripts/browser_wizard_smoke_test.ps1 -StartServer
      - name: Upload Lesson Wizard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-lesson-wizard
          path: output/playwright/rclaimlab-lesson-wizard-*.png

  workflow-wizard-smoke:
    name: Progressive role Workflow Wizard smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install Chromium for Workflow Wizard smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run purpose-to-handoff workflow authoring flow
        shell: pwsh
        run: ./scripts/browser_workflow_wizard_smoke_test.ps1
      - name: Upload storyboard-aligned Workflow Wizard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-workflow-wizard
          path: |
            output/playwright/rclaimlab-storyboard-*.png

  persona-browser:
    name: Learner and screen-reader proxy
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for persona browser test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run learner and accessibility-tree proxy
        shell: pwsh
        run: ./scripts/persona_validation.ps1 -StartServer
      - name: Upload persona screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclaimlab-persona-validation
          path: output/audit/persona-validation
