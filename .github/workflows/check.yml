name: R-LearnXR external validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  r-version-contract:
    name: R contract (${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: [oldrel, release, devel]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck any::covr
          needs: check
      - uses: r-lib/actions/check-r-package@v2
      - name: Evidence Compiler contract coverage
        if: matrix.r == 'release'
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests", quiet = TRUE)
          details <- as.data.frame(coverage)
          core_files <- c("R/evidence_spec.R", "R/evidence_adapters.R", "R/compile_lesson.R", "R/lesson_manifest.R")
          core <- details[details$filename %in% core_files, , drop = FALSE]
          overall_percent <- covr::percent_coverage(coverage)
          core_percent <- 100 * mean(core$value > 0)
          message("Overall coverage: ", round(overall_percent, 2), "%")
          message("Evidence Compiler coverage: ", round(core_percent, 2), "%")
          if (overall_percent < 85) stop("Overall coverage is below 85%")
          if (core_percent < 95) stop("Evidence Compiler contract coverage is below 95%")

  r-package-and-lessons:
    name: R package and lessons (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck any::remotes
          needs: check
      - uses: r-lib/actions/check-r-package@v2
      - name: Install source package for Quarto execution
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source', quiet = TRUE)"
      - name: Build reference lessons
        run: Rscript scripts/build_all_lessons.R
      - name: Check all reference lessons
        run: Rscript scripts/check_all_lessons.R
      - name: Render all Quarto lessons
        run: |
          quarto render examples/lesson
          quarto render examples/penguin-pca
          quarto render examples/mtcars-efficiency
          quarto render examples/learning-analytics
          quarto render examples/edm-patterns
      - name: Upload lesson reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-lessons-${{ matrix.os }}
          path: |
            examples/*/_site
            examples/*/checks

  public-install:
    name: Preserve stable public v1.1.0 install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: check
      - name: Install from public main into a clean library
        shell: Rscript {0}
        run: |
          clean_lib <- file.path(tempdir(), "rlearnxr-clean-library")
          dir.create(clean_lib, recursive = TRUE)
          .libPaths(c(clean_lib, .libPaths()))
          remotes::install_git("https://github.com/Educatian/rlearnxr.git", ref = "main", upgrade = "never")
          library(rlearnxr, lib.loc = clean_lib)
          stopifnot(as.character(packageVersion("rlearnxr")) == "1.1.0")
          stopifnot(all(c("check_lesson", "render_scene", "scaffold_lesson") %in% getNamespaceExports("rlearnxr")))
          message("Public main clean-install rehearsal passed")

  pkgdown:
    name: Build pkgdown and check links
    runs-on: ubuntu-latest
    needs: r-version-contract
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown any::urlchecker
          needs: website
      - name: Build documentation site
        run: Rscript -e "pkgdown::build_site(new_process = FALSE)"
      - name: Check package URLs
        run: Rscript -e "urlchecker::url_check()"
      - name: Upload pkgdown site
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-pkgdown
          path: site

  posit-cloud-persona-proxy:
    name: Posit Cloud clean-room persona proxy
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes any::palmerpenguins
          needs: check
      - name: Run clean-room authoring persona
        run: Rscript scripts/persona_validation.R
      - name: Upload Posit Cloud proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-posit-cloud-persona-proxy
          path: output/audit/persona-validation/posit-cloud-proxy.csv

  browser-smoke:
    name: Browser interaction smoke test
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke test
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Start static lesson server
        run: python3 -m http.server 8770 --bind 127.0.0.1 > /tmp/rlearnxr-http.log 2>&1 &
      - name: Run browser keyboard and responsive smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli=(npx --yes --package @playwright/cli playwright-cli -s=ci-smoke)
          "${cli[@]}" open http://127.0.0.1:8770/examples/lesson/scene/index.html
          "${cli[@]}" snapshot
          "${cli[@]}" resize 390 844
          "${cli[@]}" eval "() => { document.querySelector('#ai-tab').click(); return 'ai-tab-open'; }"
          "${cli[@]}" eval "() => { const root = document.documentElement; if (root.scrollWidth > root.clientWidth + 1) throw new Error('mobile horizontal overflow'); return 'mobile-width-ok'; }"
          "${cli[@]}" fill "#ai-prompt" "Show the three-dimensional relationship between x, y, and z."
          "${cli[@]}" click "#generate-ai-brief"
          "${cli[@]}" run-code "async page => { await page.waitForFunction(() => { const card = document.querySelector('#ai-result-card'); return card && !card.hidden; }, null, { timeout: 15000 }); }"
          "${cli[@]}" eval "() => { const code = document.querySelector('#ai-generated-code').textContent; if (!code.includes('set.seed(2026)')) throw new Error('AI brief missing deterministic code'); return 'ai-brief-ok'; }"
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-mobile.png
          "${cli[@]}" eval "() => { document.querySelector('#scene-tab').click(); document.querySelector('#scene').focus(); return 'scene-focused'; }"
          "${cli[@]}" press ArrowRight
          "${cli[@]}" press ArrowUp
          "${cli[@]}" press Home
          "${cli[@]}" eval "() => { const canvas = document.querySelector('#scene'); if (document.activeElement !== canvas) throw new Error('canvas lost keyboard focus'); if (!document.querySelector('#points-table')) throw new Error('semantic table missing'); return 'keyboard-and-table-ok'; }"
          "${cli[@]}" resize 1440 920
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-desktop.png
          "${cli[@]}" run-code "async page => { await page.goto('http://127.0.0.1:8770/examples/penguin-pca/scene/index.html', {waitUntil: 'domcontentloaded'}); }"
          "${cli[@]}" eval "() => { const question = document.querySelector('#lesson-question')?.textContent || ''; const diagnostics = document.querySelector('#method-diagnostics')?.textContent || ''; const criteriaText = document.querySelector('#criteria-grid')?.textContent || ''; const source = document.querySelector('#source-analysis-code')?.textContent || ''; const evidenceHead = document.querySelector('#compiled-evidence-head')?.textContent || ''; const criteria = document.querySelectorAll('#criteria-grid .criterion').length; const commands = document.querySelectorAll('#analysis-command-explanations li').length; if (!question.includes('Which morphology measurements vary together')) throw new Error('compiled PCA question missing'); if (!diagnostics.includes('Largest absolute PC1 loading')) throw new Error('PCA diagnostic missing'); if (!criteriaText.includes('Names a principal component')) throw new Error('PCA criterion missing'); if (!source.includes('complete.cases')) throw new Error('complete-case command missing'); if (!evidenceHead.includes('PC1') || document.querySelectorAll('#compiled-evidence-body tr').length < 3) throw new Error('full Evidence IR table missing'); if (criteria !== 4 || commands < 8) throw new Error('compiled method contract missing'); if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) throw new Error('method desktop overflow'); return 'method-contract-desktop-ok'; }"
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-method-contract-desktop.png
          "${cli[@]}" resize 390 844
          "${cli[@]}" eval "() => { if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) throw new Error('method mobile overflow'); const grid = document.querySelector('#criteria-grid'); if (!grid || grid.getBoundingClientRect().right > document.documentElement.clientWidth + 1) throw new Error('method criteria overflow'); return 'method-contract-mobile-ok'; }"
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-method-contract-mobile.png
          "${cli[@]}" resize 1440 920
          "${cli[@]}" run-code "async page => { await page.goto('http://127.0.0.1:8770/examples/edm-patterns/scene/index.html', {waitUntil: 'domcontentloaded'}); }"
          "${cli[@]}" eval "() => { const header = document.querySelector('#compiled-evidence-head')?.textContent || ''; const diagnostics = document.querySelector('#method-diagnostics')?.textContent || ''; const criteria = document.querySelector('#criteria-grid')?.textContent || ''; if (!header.includes('cluster') || !header.includes('distance_to_centroid')) throw new Error('k-means evidence columns missing'); if (!diagnostics.includes('Sensitivity across k and seeds')) throw new Error('k-means stability diagnostic missing'); if (!criteria.includes('centroid distance')) throw new Error('k-means criterion missing'); return 'kmeans-contract-ok'; }"
          "${cli[@]}" eval "() => { const details = document.querySelector('#compiled-evidence-alternative'); details.open = true; details.scrollIntoView({block: 'start'}); return 'full-evidence-table-open'; }"
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-kmeans-contract-desktop.png
          "${cli[@]}" close
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-browser-smoke
          path: output/playwright/rlearnxr-browser-smoke-*.png

  browser-offline-smoke:
    name: Offline WebR fallback smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run offline fallback test
        shell: pwsh
        run: ./scripts/browser_offline_smoke_test.ps1 -StartServer
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-browser-offline-fallback
          path: output/playwright/rlearnxr-browser-offline-fallback.png

  course-home-smoke:
    name: Learner course home smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for course-home smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run course-home navigation and responsive test
        shell: pwsh
        run: ./scripts/browser_course_smoke_test.ps1 -StartServer
      - name: Upload course-home screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-course-home
          path: output/playwright/rlearnxr-course-home-*.png

  lesson-wizard-smoke:
    name: Local CSV Lesson Wizard smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install Chromium for Lesson Wizard smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run local CSV to compiled lesson flow
        shell: pwsh
        run: ./scripts/browser_wizard_smoke_test.ps1 -StartServer
      - name: Upload Lesson Wizard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-lesson-wizard
          path: output/playwright/rlearnxr-lesson-wizard-*.png

  persona-browser:
    name: Learner and screen-reader proxy
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for persona browser test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run learner and accessibility-tree proxy
        shell: pwsh
        run: ./scripts/persona_validation.ps1 -StartServer
      - name: Upload persona screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-persona-validation
          path: output/audit/persona-validation
