name: R package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - uses: r-lib/actions/check-r-package@v2
      - name: Build reference lessons
        run: Rscript scripts/build_all_lessons.R
      - name: Check reference lessons
        run: Rscript scripts/check_all_lessons.R
      - name: Render Quarto lessons
        run: |
          quarto render examples/lesson
          quarto render examples/penguin-pca
      - name: Upload rendered lessons and reproducibility reports
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-reference-lessons
          path: |
            examples/*/_site
            examples/*/checks
