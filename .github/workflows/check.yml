name: R-LearnXR external validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  r-package-and-lessons:
    name: R package and lessons (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck any::remotes
          needs: check
      - uses: r-lib/actions/check-r-package@v2
      - name: Install source package for Quarto execution
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source', quiet = TRUE)"
      - name: Build reference lessons
        run: Rscript scripts/build_all_lessons.R
      - name: Check all reference lessons
        run: Rscript scripts/check_all_lessons.R
      - name: Render all Quarto lessons
        run: |
          quarto render examples/lesson
          quarto render examples/penguin-pca
          quarto render examples/mtcars-efficiency
      - name: Upload lesson reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-lessons-${{ matrix.os }}
          path: |
            examples/*/_site
            examples/*/checks

  public-install:
    name: Install current public main from GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: check
      - name: Install from public main into a clean library
        shell: Rscript {0}
        run: |
          clean_lib <- file.path(tempdir(), "rlearnxr-clean-library")
          dir.create(clean_lib, recursive = TRUE)
          .libPaths(c(clean_lib, .libPaths()))
          remotes::install_git("https://github.com/Educatian/rlearnxr.git", ref = "main", upgrade = "never")
          library(rlearnxr, lib.loc = clean_lib)
          stopifnot(as.character(packageVersion("rlearnxr")) == "0.1.0")
          stopifnot(all(c("check_lesson", "render_scene", "scaffold_lesson") %in% getNamespaceExports("rlearnxr")))
          message("Public main clean-install rehearsal passed")

  posit-cloud-persona-proxy:
    name: Posit Cloud clean-room persona proxy
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes any::palmerpenguins
          needs: check
      - name: Run clean-room authoring persona
        run: Rscript scripts/persona_validation.R
      - name: Upload Posit Cloud proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-posit-cloud-persona-proxy
          path: output/audit/persona-validation/posit-cloud-proxy.csv

  browser-smoke:
    name: Browser interaction smoke test
    runs-on: ubuntu-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke test
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Start static lesson server
        run: python3 -m http.server 8770 --bind 127.0.0.1 > /tmp/rlearnxr-http.log 2>&1 &
      - name: Run browser keyboard and responsive smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli=(npx --yes --package @playwright/cli playwright-cli -s=ci-smoke)
          "${cli[@]}" open http://127.0.0.1:8770/examples/lesson/scene/index.html
          "${cli[@]}" snapshot
          "${cli[@]}" resize 390 844
          "${cli[@]}" eval "() => { document.querySelector('#ai-tab').click(); return 'ai-tab-open'; }"
          "${cli[@]}" eval "() => { const root = document.documentElement; if (root.scrollWidth > root.clientWidth + 1) throw new Error('mobile horizontal overflow'); return 'mobile-width-ok'; }"
          "${cli[@]}" fill "#ai-prompt" "Show the three-dimensional relationship between x, y, and z."
          "${cli[@]}" click "#generate-ai-brief"
          "${cli[@]}" run-code "async page => { await page.waitForFunction(() => { const card = document.querySelector('#ai-result-card'); return card && !card.hidden; }, null, { timeout: 15000 }); }"
          "${cli[@]}" eval "() => { const code = document.querySelector('#ai-generated-code').textContent; if (!code.includes('set.seed(2026)')) throw new Error('AI brief missing deterministic code'); return 'ai-brief-ok'; }"
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-mobile.png
          "${cli[@]}" eval "() => { document.querySelector('#scene-tab').click(); document.querySelector('#scene').focus(); return 'scene-focused'; }"
          "${cli[@]}" press ArrowRight
          "${cli[@]}" press ArrowUp
          "${cli[@]}" press Home
          "${cli[@]}" eval "() => { const canvas = document.querySelector('#scene'); if (document.activeElement !== canvas) throw new Error('canvas lost keyboard focus'); if (!document.querySelector('#points-table')) throw new Error('semantic table missing'); return 'keyboard-and-table-ok'; }"
          "${cli[@]}" resize 1440 920
          "${cli[@]}" screenshot --filename=output/playwright/rlearnxr-browser-smoke-desktop.png
          "${cli[@]}" close
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-browser-smoke
          path: output/playwright/rlearnxr-browser-smoke-*.png

  browser-offline-smoke:
    name: Offline WebR fallback smoke test
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run offline fallback test
        shell: pwsh
        run: ./scripts/browser_offline_smoke_test.ps1 -StartServer
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-browser-offline-fallback
          path: output/playwright/rlearnxr-browser-offline-fallback.png

  persona-browser:
    name: Learner and screen-reader proxy
    runs-on: windows-latest
    needs: r-package-and-lessons
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for persona browser test
        shell: pwsh
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Run learner and accessibility-tree proxy
        shell: pwsh
        run: ./scripts/persona_validation.ps1 -StartServer
      - name: Upload persona screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlearnxr-persona-validation
          path: output/audit/persona-validation
