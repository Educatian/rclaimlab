name: Accessibility finding
description: Report a barrier or improvement for an assistive-technology path.
title: "[Accessibility] "
labels: [accessibility]
body:
  - type: textarea
    id: task
    attributes:
      label: Task and interaction method
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Observed barrier
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected accessible outcome
    validations:
      required: true
